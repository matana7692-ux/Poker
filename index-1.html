<style>
/* Layout: a dimmed card room; the felt oval is the whole screen, seats ring it, the player's dock sits under it. */
:root{

  --felt:#1f5c4b; --felt-deep:#0f3a2f; --rail:#3a2617;

  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;

*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.app{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:10px 16px;display:flex;flex-direction:column;gap:10px;min-height:100%}

.top{flex-wrap:nowrap}
.menubtn{position:relative;width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--room-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}

.menubtn .dot{position:absolute;top:-6px;left:-6px}

.minfo{font-size:13px;color:var(--muted);line-height:1.6}

.mme{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.mtitle{font-weight:700;color:var(--bone)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--room-2);font-size:13px;color:var(--muted);white-space:nowrap}
.pill.game{color:var(--brass-ink);background:var(--brass);border-color:var(--brass);font-weight:700}

.card i{font-style:normal;font-size:20px}
.card.sm{width:36px;height:50px}.card.sm b{font-size:18px}.card.sm i{font-size:15px}
.card.lg{width:66px;height:92px}.card.lg b{font-size:31px}.card.lg i{font-size:26px}
.card.s-s{color:var(--s-s)}.card.s-h{color:var(--s-h)}.card.s-d{color:var(--s-d)}.card.s-c{color:var(--s-c)}

.handname{font-family:var(--f-display);font-size:18px;color:var(--bone)}
.eq{display:flex;flex-direction:column;gap:4px;min-width:180px;flex:1}
.eqbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}

.btn:disabled{opacity:.4;cursor:default}
.raise{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}

label.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}

/* panels open as a full-screen sheet inside the page, over the table */
.drawer{position:fixed;inset:0;z-index:15;background:var(--room);display:flex;flex-direction:column;gap:12px;min-width:0;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.drawer > *{width:100%;max-width:820px;margin-inline:auto}
.dbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:calc(-12px - env(safe-area-inset-top,0px));background:var(--room);padding-block:6px;z-index:1;border-bottom:1px solid var(--line)}
.dbar .tab{font-size:13px}
.dbar .close{margin-inline-start:auto}
.drawer .log,.drawer .chatlist{max-height:none;flex:1}
.drawer #chatForm{position:sticky;bottom:calc(-12px - env(safe-area-inset-bottom,0px));background:var(--room);padding-block:8px}
.drawer h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0;color:var(--bone)}

.msg.mine{align-self:flex-end;border-color:var(--brass)}
.msg .mh{display:flex;gap:8px;align-items:baseline;font-size:12px}
.msg .mh b{color:var(--brass)}.msg .mh span{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

.style.agg{border-color:var(--danger);color:var(--danger)}
.style.pas{border-color:var(--cool);color:var(--cool)}
.meter{display:inline-block;width:64px;height:6px;border-radius:999px;background:var(--line);vertical-align:middle;margin-inline-start:6px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--danger)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}

.sheet{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:16px}
.sheet .box{background:var(--room-2);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(400px,100%);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}

.lobby{max-width:640px;width:100%;margin:24px auto;display:flex;flex-direction:column;gap:14px}

.tname{font-family:var(--f-display);font-size:19px;color:var(--bone)}

.dotlive{color:var(--ok);font-weight:600}

@media (max-width:640px){
  .felt{aspect-ratio:5/7;margin:34px 40px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const FIREBASE_CONFIG = {

/*ENGINE*/
// Public state S is shared with everyone. Secret K (deck + hole cards) lives only with the dealer.
const NS = 9;
const RANKS = '23456789TJQKA';
const RV = r => RANKS.indexOf(r) + 2;
const RN = v => ({11:'J',12:'Q',13:'K',14:'A',10:'10'})[v] || String(v);
const GAME_NAME = {holdem:"הולדם", omaha:"אומהה", pineapple:"פיינאפל"};

function rnd(n){
  if (typeof crypto !== 'undefined' && crypto.getRandomValues){ const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] % n; }
  return Math.floor(Math.random()*n);
}
function newDeck(){
  const d = [];
  for (const r of RANKS) for (const s of 'shdc') d.push(r+s);
  for (let i = d.length-1; i > 0; i--){ const j = rnd(i+1); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
function* combos(arr, k, start=0, pick=[]){
  if (pick.length === k){ yield pick.slice(); return; }
  for (let i = start; i <= arr.length-(k-pick.length); i++){ pick.push(arr[i]); yield* combos(arr, k, i+1, pick); pick.pop(); }
}
function eval5(cs){
  const vs = cs.map(c => RV(c[0])).sort((a,b) => b-a);
  const flush = cs.every(c => c[1] === cs[0][1]);
  const cnt = {}; vs.forEach(v => cnt[v] = (cnt[v]||0)+1);
  const g = Object.entries(cnt).map(([v,c]) => [+v,c]).sort((a,b) => b[1]-a[1] || b[0]-a[0]);
  const u = [...new Set(vs)];
  let sh = 0;
  if (u.length === 5){ if (u[0]-u[4] === 4) sh = u[0]; else if (u[0] === 14 && u[1] === 5) sh = 5; }
  let cat, ks;
  if (sh && flush){ cat = 8; ks = [sh]; }
  else if (g[0][1] === 4){ cat = 7; ks = [g[0][0], g[1][0]]; }
  else if (g[0][1] === 3 && g[1][1] === 2){ cat = 6; ks = [g[0][0], g[1][0]]; }

  if (!h || h.street === 'done' || !h.deadline || now < h.deadline || S.paused || h.pending) return false;
  if (h.street === 'discard'){
    for (const i of seatIdxs(h)){
      const p = h.P[i];
      if (!p.folded && p.n === 3){
        let idx = rnd(3);
        if (kOk(K, h)){ const c = K.hole[i]; idx = 0; c.forEach((x,k) => { if (RV(x[0]) < RV(c[idx][0])) idx = k; }); }
        p.disc = idx; p.n = 2;
        addLog(S, `${nm(S,i)} לא בחר בזמן, נזרק קלף אוטומטית`);
      }
    }
    h.deadline = null; progress(S, K, now); return true;
  }
  const i = h.toAct; if (i == null) return false;
  const s = S.seats[i];
  const toCall = h.currentBet - h.P[i].bet;
  if (s){ s.timeouts = (s.timeouts||0) + 1; if (s.timeouts >= 2){ s.sitOut = true; addLog(S, `${nm(S,i)} עבר להפסקה אחרי שתי פעמים בלי תגובה`); } }
  if (toCall <= 0){ h.P[i].acted = true; addLog(S, `${nm(S,i)} צ'ק (נגמר הזמן)`); }
  else { h.P[i].folded = true; addLog(S, `${nm(S,i)} מקפל (נגמר הזמן)`); }
  progress(S, K, now);
  return true;
}
// Monte Carlo win chance against random hands
function equitySample(hole, board, game, nOpp, dead, iters){
  const known = new Set([...hole, ...board, ...dead]);
  const rest = []; for (const r of RANKS) for (const s of 'shdc'){ const c = r+s; if (!known.has(c)) rest.push(c); }
  const oppN = game === 'omaha' ? 4 : 2;
  const needB = 5 - board.length;
  let score = 0, done = 0;
  for (let t = 0; t < iters; t++){
    const take = needB + nOpp*oppN;
    if (take > rest.length) break;
    for (let k = 0; k < take; k++){ const j = k + rnd(rest.length - k); [rest[k], rest[j]] = [rest[j], rest[k]]; }
    const b = board.concat(rest.slice(0, needB));
    const mine = bestHand(hole, b, game).score;
    let better = 0, ties = 0;
    for (let o = 0; o < nOpp; o++){
      const oh = rest.slice(needB + o*oppN, needB + (o+1)*oppN);
      const sc = bestHand(oh, b, game).score;
      if (sc > mine){ better = 1; break; }
      if (sc === mine) ties++;
    }
    if (!better) score += 1 / (ties + 1);
    done++;
  }
  return {score, done};
}
// Bots: decide from their own cards and the board only, like any player would.
const BOT_NAMES = ['בוט רוני','בוט מאיה','בוט אלון','בוט נועה','בוט גיל','בוט שירה','בוט דני','בוט טל','בוט יעל'];
const BOT_LEVELS = {easy:'קל', normal:'רגיל', hard:'קשה'};
function botToMove(S){
  const h = S.hand; if (!h || h.street === 'done' || h.pending) return null;
  if (h.street === 'discard'){
    const q = seatIdxs(h).find(i => S.seats[i] && S.seats[i].bot && !h.P[i].folded && h.P[i].n === 3);
    return q == null ? null : q;
  }
  return h.toAct != null && S.seats[h.toAct] && S.seats[h.toAct].bot ? h.toAct : null;
}
function botDecide(S, K, i){
  const h = S.hand, p = h.P[i], s = S.seats[i];
  const cfg = ({easy:{agg:0.45, loose:0.12, bluff:0.03}, normal:{agg:1, loose:0, bluff:0.07}, hard:{agg:1.35, loose:-0.03, bluff:0.12}})[s.bot] || {agg:1, loose:0, bluff:0.07};
  const others = seatIdxs(h).filter(j => j !== i && !h.P[j].folded).length;
  if (!kOk(K, h)) return h.street === 'discard' ? {type:'discard', idx:0} : {type: h.currentBet - p.bet > 0 ? 'fold' : 'check'};
  if (h.street === 'discard'){
    const raw = K.hole[i]; let best = 0, bv = -1;
    for (let k = 0; k < 3; k++){
      const keep = raw.filter((_, x) => x !== k);
      const r = equitySample(keep, h.board, 'holdem', Math.max(1, Math.min(others, 3)), [raw[k]], 80);
      const v = r.done ? r.score / r.done : 0;
      if (v > bv){ bv = v; best = k; }
    }
    return {type:'discard', idx:best};
  }
  const hole = holeOf(K, h, i);
  const game = h.game === 'omaha' ? 'omaha' : 'holdem';
  const dead = K.hole[i].filter(c => !hole.includes(c));
  const r = equitySample(hole, h.board, game, Math.max(1, Math.min(others, 4)), dead, game === 'omaha' ? 90 : 220);
  const eq = r.done ? r.score / r.done : 0.5;
  const strength = eq * (others + 1);          // 1 = an average hand at this table
  const toCall = h.currentBet - p.bet;
  const pot = potTotal(h);
  const lim = raiseLimits(S, h, i);
  const R = Math.random();
  const sizeTo = f => Math.max(lim.min, Math.min(lim.max, Math.round(h.currentBet + f*(pot + toCall))));
  if (toCall <= 0){
    if (lim && ((strength > 1.6 && R < 0.75*cfg.agg) || (strength > 1.25 && R < 0.3*cfg.agg) || R < cfg.bluff))
      return {type:'raise', amount:sizeTo(strength > 2 ? 0.75 : 0.5)};
    return {type:'check'};
  }
  const potOdds = toCall / (pot + toCall);
  if (lim && strength > 1.9 && R < 0.55*cfg.agg) return {type:'raise', amount:sizeTo(strength > 2.4 ? 1 : 0.66)};
  if (eq + cfg.loose >= potOdds*1.05 || (toCall <= h.bbAmt && eq + cfg.loose > potOdds*0.8)) return {type:'call'};
  if (lim && R < cfg.bluff*0.5) return {type:'raise', amount:sizeTo(0.75)};
  return {type:'fold'};
}
function botAct(S, K, i, d, now){
  if (d.type === 'discard') return discard(S, K, i, d.idx, now);
  return act(S, K, i, d.type, d.amount || 0, now);
}

/* ---------- crypto: each player's hole cards are encrypted to that player's own key ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ECDH = {name:'ECDH', namedCurve:'P-256'};
async function ensureKeys(){
  if (!crypto || !crypto.subtle || !myId) return;
  let pair = null;
  try { const raw = localStorage.getItem('pk_keys_' + myId); if (raw) pair = JSON.parse(raw); } catch(e){}
  if (!pair){ try { const d = await db.doc(`users/${myId}/keys/main`).get(); if (d.exists) pair = clone(d.data()); } catch(e){} }
  if (!pair || !pair.priv || !pair.pub){
    const kp = await crypto.subtle.generateKey(ECDH, true, ['deriveKey']);
    pair = {pub: await crypto.subtle.exportKey('jwk', kp.publicKey), priv: await crypto.subtle.exportKey('jwk', kp.privateKey)};
    try { await db.doc(`users/${myId}/keys/main`).set(pair); } catch(e){}
  }
  try { localStorage.setItem('pk_keys_' + myId, JSON.stringify(pair)); } catch(e){}
  myPriv = await crypto.subtle.importKey('jwk', pair.priv, ECDH, false, ['deriveKey']);
  myPub = JSON.stringify({kty:pair.pub.kty, crv:pair.pub.crv, x:pair.pub.x, y:pair.pub.y});
}
async function encryptHoles(T, KS){
  const h = T.hand;
  const eph = await crypto.subtle.generateKey(ECDH, true, ['deriveKey']);
  const epk = await crypto.subtle.exportKey('jwk', eph.publicKey);
  h.epk = {kty:epk.kty, crv:epk.crv, x:epk.x, y:epk.y};
  for (const i of seatIdxs(h)){
    const s = T.seats[i]; const p = h.P[i];
    if (!s || !s.pk){ p.open = KS.hole[i]; continue; }
    try {
      const pub = await crypto.subtle.importKey('jwk', JSON.parse(s.pk), ECDH, false, []);
      const key = await crypto.subtle.deriveKey({name:'ECDH', public:pub}, eph.privateKey, {name:'AES-GCM', length:256}, false, ['encrypt']);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv, additionalData:new TextEncoder().encode(String(h.no))}, key, new TextEncoder().encode(JSON.stringify(KS.hole[i])));
      p.enc = {iv:b64(iv), ct:b64(ct)};
    } catch(e){ p.open = KS.hole[i]; }
  }
}
function myRawCards(i){
  const h = S.hand; if (!h || !h.P[i]) return null;
  if (LOCAL) return kOk(K, h) ? K.hole[i] : null;
  if (amDealer() && kOk(K, h)) return K.hole[i];
  const p = h.P[i];
  if (p.open) return p.open;
  const key = `${h.no}:${i}`;
  const c = decCache[key];
  if (Array.isArray(c)) return c;
  if (!c && p.enc && h.epk && myPriv){
    decCache[key] = 'busy';
    (async () => {
      try {
        const pub = await crypto.subtle.importKey('jwk', h.epk, ECDH, false, []);
        const k = await crypto.subtle.deriveKey({name:'ECDH', public:pub}, myPriv, {name:'AES-GCM', length:256}, false, ['decrypt']);
        const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(p.enc.iv), additionalData:new TextEncoder().encode(String(h.no))}, k, unb64(p.enc.ct));
        decCache[key] = JSON.parse(new TextDecoder().decode(pt));
      } catch(e){ decCache[key] = 'fail'; }
      render();
    })();
  }
  return null;
}

// Every change runs in a Firestore transaction: read the table, apply the move, write it back.
// The host's deck is written in the same transaction, so table and deck never drift apart.
async function mutate(fn){
  if (LOCAL){
    const next = S ? clone(S) : null;
    const r = await fn(next);
    if (r === false) return false;
    S = next; render(); return true;
  }
  if (!ref) return false;
  const job = chain.then(async () => {
    const kSaved = K ? clone(K) : null;
    let ok = false, first = true;
    try {
      await db.runTransaction(async tx => {
        if (!first) K = kSaved ? clone(kSaved) : null;
        first = false; ok = false;
        const snap = await tx.get(ref);
        if (!snap.exists) return;
        const next = clone(snap.data());
        const r = await fn(next);
        if (r === false){ K = kSaved ? clone(kSaved) : null; return; }
        next.v = (next.v||0) + 1;
        if (next.hostId === myId && K && K._dirty && tid){ const k2 = clone(K); delete k2._dirty; tx.set(deckRef(), k2); }
        tx.set(ref, clone(next));
        ok = true;
      });
      if (ok && K) K._dirty = false;
      return ok;
    } catch(e){
      K = kSaved ? clone(kSaved) : null;
      toast(e && e.code === 'permission-denied' ? 'אין הרשאה לשמור. בדוק את כללי האבטחה ב-Firebase.' : 'הפעולה לא נשמרה, נסה שוב');
      return false;
    }
  });
  chain = job.catch(() => {});
  return job;
}

/* ---------- equity ---------- */
function equityFor(key, hole, board, game, nOpp, dead){
  if (eqCache[key] && eqCache[key].final) return eqCache[key];
  if (!eqCache[key]){ eqCache[key] = {score:0, done:0, final:false}; eqQueue.push({key, hole, board, game, nOpp, dead}); pumpEq(); }
  return eqCache[key];
}
function pumpEq(){
  if (eqBusy || !eqQueue.length) return;
  eqBusy = true;
  const job = eqQueue[0];
  const target = job.game === 'omaha' ? 900 : 3000;
  const step = () => {
    const e = eqCache[job.key];
    const r = equitySample(job.hole, job.board, job.game, job.nOpp, job.dead, job.game === 'omaha' ? 60 : 250);
    e.score += r.score; e.done += r.done;
    if (e.done >= target || r.done === 0){ e.final = true; eqQueue.shift(); eqBusy = false; paintEq(); pumpEq(); return; }
    paintEq();
    setTimeout(step, 0);
  };
  setTimeout(step, 0);
}
function paintEq(){
  document.querySelectorAll('[data-eq]').forEach(el => {
    const e = eqCache[el.dataset.eq]; if (!e || !e.done) return;
    const v = Math.round(100*e.score/e.done);
    const t = el.querySelector('.eqv'); if (t) t.textContent = v + '%';
    const b = el.querySelector('.eqbar span'); if (b) b.style.width = v + '%';
  });
}

function bindWelcome(){
  const b = $('#create'); if (!b) return;
  b.onclick = async () => {
    if (LOCAL){ S = newTable('local'); render(); return; }
    const job = chain.then(async () => {
      const snap = await ref.get();
      if (snap.exists) return;
      try { await ref.set(newTable(myId)); } catch(e){ toast('אין לך הרשאה לפתוח שולחן כאן'); }
    });
    chain = job.catch(() => {});
  };
}
function openSit(i){
  const lastName = (() => { try { return localStorage.getItem('pk_name') || ''; } catch(e){ return ''; } })();
  $('#sheet').innerHTML = `<div class="sheet" id="sitSheet"><form class="box" id="sitForm">
    <h2 style="margin:0;font-family:var(--f-display);font-weight:400">כיסא ${i+1}</h2>
    <label class="field">שם בשולחן<input type="text" id="sitName" maxlength="18" required value="${esc(LOCAL ? '' : (lastName || myDefaultName))}"></label>
    <label class="field">כמה צ׳יפים<input type="number" id="sitAmt" min="1" value="${st().startStack}"></label>
    ${!LOCAL && st().approval && !isHost() ? '<div class="note">המארח יקבל בקשה ויאשר אותך.</div>' : ''}
    <div class="row"><button class="btn primary">${LOCAL ? 'הוסף שחקן' : 'שב'}</button><button type="button" class="btn ghost" id="sitCancel">ביטול</button></div>
  </form></div>`;
  $('#sitName').focus();
  $('#sitCancel').onclick = () => $('#sheet').innerHTML = '';
  $('#sitSheet').onclick = e => { if (e.target.id === 'sitSheet') $('#sheet').innerHTML = ''; };
  $('#sitForm').onsubmit = e => {
    e.preventDefault();
    const name = $('#sitName').value.trim().slice(0,18); const amt = Math.max(1, Math.floor(+$('#sitAmt').value || 0));
    if (!name) return;

    $('#sheet').innerHTML = '';
    const id = LOCAL ? 'p' + Math.random().toString(36).slice(2,8) : myId;
    mutate(T => {
      if (T.seats[i]){ toast('הכיסא נתפס'); return false; }
      if (!LOCAL && T.seats.some(x => x && x.id === id)) return false;
      if (!LOCAL && T.settings.approval && T.hostId !== id){
        T.requests = T.requests.filter(r => r.id !== id);
        T.requests.push({type:'sit', id, name, seat:i, amount:amt, pk:myPub});
        return;
      }
      seatPlayer(T, i, id, name, amt, myPub);
    });
  };
}

function addBot(T, i, level){
  const used = new Set(T.seats.filter(Boolean).map(x => x.name));
  const name = BOT_NAMES.find(n => !used.has(n)) || ('בוט ' + (i+1));
  seatPlayer(T, i, 'bot_' + Math.random().toString(36).slice(2, 9), name, T.settings.startStack, myPub);
  T.seats[i].bot = level;
  addLog(T, `${name} (${BOT_LEVELS[level]}) הצטרף לשולחן`);
}
function seatPlayer(T, i, id, name, amt, pk){
  T.seats[i] = {id, name, stack:amt, sitOut:false, add:0, timeouts:0, bank:T.settings.timeBank, pk:pk || null};
  const L = ledgerOf(T, id, name);
  L.buyin += amt; L.entries.push(amt);
  addLog(T, `${name} התיישב בכיסא ${i+1} עם ${amt}`);
}
function addChips(T, i, amt){
  const s = T.seats[i]; if (!s || !amt) return;
  const inHand = T.hand && T.hand.street !== 'done' && T.hand.P[i];
  if (inHand) s.add = (s.add||0) + amt; else s.stack = Math.max(0, s.stack + amt);
  if (s.stack + (s.add||0) < 0) s.add = -s.stack;
  const L = ledgerOf(T, s.id, s.name);
  L.buyin += amt; L.entries.push(amt);
  addLog(T, `${s.name} ${amt > 0 ? (s.stack <= 0 ? 'נכנס שוב עם' : 'הוסיף') : 'הוריד'} ${Math.abs(amt)} צ׳יפים${inHand ? ' (מהיד הבאה)' : ''}`);
}

/* ---------- binding ---------- */
function bindAll(){
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = e => { e.preventDefault(); panel = b.dataset.tab; menuOpen = false; confirmReset = false; confirmVoid = false; render(); });
  document.querySelectorAll('[data-menu]').forEach(b => b.onclick = e => { e.preventDefault(); menuOpen = !menuOpen; render(); });
  const rm = $('#r-menu'); if (rm) rm.onclick = e => { if (e.target === rm){ menuOpen = false; render(); } };
  document.querySelectorAll('[data-lobby]').forEach(b => b.onclick = () => { menuOpen = false; goLobby(); });
  document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { const i = +b.dataset.back; mutate(T => { const x = T.seats[i]; if (!x) return false; x.sitOut = false; x.timeouts = 0; addLog(T, `${x.name} חזר לשחק`); }); });
  document.querySelectorAll('[data-share]').forEach(b => b.onclick = shareLink);
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = e => { e.preventDefault(); panel = null; render(); });
  document.querySelectorAll('[data-sit]').forEach(b => b.onclick = () => openSit(+b.dataset.sit));
  document.querySelectorAll('[data-info]').forEach(b => { b.onclick = () => openInfo(+b.dataset.info); b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openInfo(+b.dataset.info); } }; });
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => doAct(b.dataset.act));
  document.querySelectorAll('[data-discard]').forEach(b => b.onclick = () => {
    const i = LOCAL ? +b.dataset.seat : mySeat(); const k = +b.dataset.discard;
    revealSeat = null;
    mutate(T => discard(T, KK(), i, k, Date.now()) ? undefined : false);
  });
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => setRaise(+b.dataset.preset));
  const rr = $('#raiseRange'), rn = $('#raiseNum');
  if (rr) rr.oninput = () => setRaise(+rr.value, 'range');
  if (rn) rn.oninput = () => setRaise(+rn.value, 'num');
  const pf = $('#prefold'); if (pf) pf.onchange = () => { preFold = pf.checked; preFoldHand = S.hand && S.hand.no; };
  const so = $('#sitout'); if (so) so.onchange = () => { const i = mySeat(); mutate(T => { if (!T.seats[i]) return false; T.seats[i].sitOut = so.checked; T.seats[i].timeouts = 0; addLog(T, `${T.seats[i].name} ${so.checked ? 'יצא להפסקה' : 'חזר לשחק'}`); }); };
  document.querySelectorAll('[data-host]').forEach(b => b.onclick = () => hostCmd(b.dataset.host));
  document.querySelectorAll('[data-req]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, ok = b.dataset.req === 'ok';
    const r = S.requests[k]; if (!r) return;
    mutate(T => {
      const idx = T.requests.findIndex(x => x.id === r.id && x.type === r.type); if (idx < 0) return false;
      T.requests.splice(idx, 1);
      if (!ok) return;
      if (r.type === 'sit'){ if (T.seats[r.seat] || T.seats.some(x => x && x.id === r.id)){ addLog(T, `הכיסא של ${r.name} כבר תפוס`); return; } seatPlayer(T, r.seat, r.id, r.name, r.amount, r.pk); }
      else { const i = T.seats.findIndex(x => x && x.id === r.id); if (i >= 0) addChips(T, i, r.amount); }
    });
  });
  document.querySelectorAll('[data-adj]').forEach(b => b.onclick = () => {
    const i = +b.dataset.adj; const v = Math.floor(+$('#adj'+i).value || 0); if (!v) return;
    delete drafts['adj'+i]; $('#adj'+i).value = '';
    mutate(T => { if (!T.seats[i]) return false; addChips(T, i, v); });
  });
  document.querySelectorAll('[data-kick]').forEach(b => b.onclick = () => {
    const i = +b.dataset.kick;
    mutate(T => { const s = T.seats[i]; if (!s) return false; const h = T.hand;
      if (h && h.street !== 'done' && h.P[i]){ s.leave = true; if (!h.P[i].folded) foldOutOfTurn(T, KK(), i, Date.now()); }
      else cashout(T, i); });
  });
  document.querySelectorAll('[data-mkhost]').forEach(b => b.onclick = () => { const i = +b.dataset.mkhost; mutate(T => { if (!T.seats[i]) return false; if (T.hand && T.hand.street !== 'done'){ toast('אפשר להעביר אירוח רק בין ידיים'); return false; } T.hostId = T.seats[i].id; addLog(T, `${T.seats[i].name} הוא המארח עכשיו`); }); });
  const cf = $('#chatForm'); if (cf) cf.onsubmit = e => { e.preventDefault(); const m = $('#chatIn').value.trim(); if (!m) return; $('#chatIn').value = ''; delete drafts.chatIn; sendChat(m); };
}
function setRaise(v, from){
  const h = S.hand; const i = LOCAL ? viewSeat() : mySeat(); if (!h || i < 0) return;
  const lim = raiseLimits(S, h, i); if (!lim) return;
  raiseVal = Math.max(lim.min, Math.min(lim.max, Math.floor(v || 0)));
  if (from !== 'range' && $('#raiseRange')) $('#raiseRange').value = raiseVal;
  if (from !== 'num' && $('#raiseNum')) $('#raiseNum').value = raiseVal;
  if ($('#raiseLbl')) $('#raiseLbl').textContent = raiseVal;
}
function doAct(a){
  const i = LOCAL ? viewSeat() : mySeat();
  const h = S.hand;
  if (a === 'reveal'){ revealSeat = `${h.no}:${i}:${h.street}`; render(); return; }
  if (a === 'rabbit'){
    const no = h.no;
    if (amDealer()) mutate(T => (T.hand && T.hand.no === no && rabbitHunt(T, K)) ? undefined : false);
    else mutate(T => { if (!T.hand || T.hand.no !== no || T.hand.rabbit || T.hand.rabbitReq) return false; T.hand.rabbitReq = true; });
    return;
  }
  if (a === 'show'){ const me = mySeat(); mutate(T => { const hh = T.hand; if (!hh || !hh.P[me] || hh.shownBy.includes(me)) return false; hh.shownBy.push(me); if (amDealer()) revealShown(T, K); }); return; }
  if (a === 'bank'){ mutate(T => useBank(T, i, Date.now()) ? undefined : false); return; }
  if (a === 'add'){
    const amt = Math.floor(+$('#addamt').value || 0); if (amt <= 0) return;
    mutate(T => { const s = T.seats[i]; if (!s) return false;
      if (T.settings.approval && T.hostId !== myId){ if (T.requests.some(r => r.id === myId && r.type === 'add')) return false; T.requests.push({type:'add', id:myId, name:s.name, amount:amt}); return; }
      addChips(T, i, amt); });
    return;
  }
  if (a === 'away'){
    mutate(T => { const x = T.seats[i]; if (!x) return false; x.sitOut = !x.sitOut; x.timeouts = 0; addLog(T, `${x.name} ${x.sitOut ? 'לא ליד השולחן' : 'חזר לשחק'}`); });
    return;
  }
  if (a === 'leave' && !(S.seats[i] && S.seats[i].leave) && !confirmLeave){
    confirmLeave = true; clearTimeout(confirmLeaveT); confirmLeaveT = setTimeout(() => { confirmLeave = false; render(); }, 4000); render(); return;
  }
  if (a === 'leave'){
    confirmLeave = false; clearTimeout(confirmLeaveT);
    mutate(T => { const s = T.seats[i]; if (!s) return false; const hh = T.hand;
      if (s.leave){ s.leave = false; return; }
      if (hh && hh.street !== 'done' && hh.P[i]){ s.leave = true; if (!hh.P[i].folded) foldOutOfTurn(T, KK(), i, Date.now()); }
      else cashout(T, i); });
    return;
  }
  if (a === 'foldnow'){ mutate(T => foldOutOfTurn(T, KK(), i, Date.now()) ? undefined : false); return; }
  const hand = h && h.no;
  const amt = raiseVal;
  revealSeat = null;
  mutate(T => (T.hand && T.hand.no === hand && act(T, KK(), i, a, amt, Date.now())) ? undefined : false);
}
function maybePreAction(){
  if (LOCAL || !preFold || !S || !S.hand) return;
  const h = S.hand, i = mySeat();
  if (h.toAct !== i || preFoldHand !== h.no || h.street === 'discard' || h.pending) return;
  preFold = false;
  const toCall = h.currentBet - h.P[i].bet;
  const no = h.no;
  mutate(T => (T.hand && T.hand.no === no && act(T, KK(), i, toCall > 0 ? 'fold' : 'check', 0, Date.now())) ? undefined : false);
}
function readSettings(p = 's', base = null){
  const s = base || st();
  const n = (id, d, min=0) => { const el = $('#' + p + id); const v = el ? Math.floor(+el.value) : NaN; return Number.isFinite(v) && v >= min ? v : d; };
  const v = (id, d) => { const el = $('#' + p + id); return el ? el.value : d; };
  const c = (id, d) => { const el = $('#' + p + id); return el ? el.checked : d; };
  return {sb:n('SB', s.sb, 1), bb:Math.max(n('BB', s.bb, 1), n('SB', s.sb, 1)), ante:n('Ante', s.ante), startStack:n('Stack', s.startStack, 1),
    base:v('Base', s.base), pineWhen:v('Pine', s.pineWhen), omahaLimit:v('OL', s.omahaLimit), mixOn:c('Mix', s.mixOn),
    mixEvery:n('Every', s.mixEvery, 1), mixUnit:v('Unit', s.mixUnit), mixCount:n('Count', s.mixCount, 1),
    timer:n('Timer', s.timer), timeBank:n('Bank', s.timeBank), rabbit:c('Rabbit', s.rabbit), approval:c('Appr', s.approval), autoNext:c('Auto', s.autoNext)};
}
async function dealerStart(T){
  if (!T || (T.hand && T.hand.street !== 'done')) return false;
  T.seats.forEach((x, i) => { if (x && x.bot && x.stack + (x.add||0) <= 0) addChips(T, i, T.settings.startStack); });
  const nk = {};
  if (!startHand(T, nk, Date.now())) return false;
  if (!LOCAL) await encryptHoles(T, nk);
  K = nk;
}
function hostCmd(c){
  if (c === 'claim'){
    // the old host holds this hand's deck, so a hand in progress is cancelled and chips go back
    mutate(T => { if (T.hand && T.hand.street !== 'done') voidHand(T, Date.now()); T.hostId = myId; K = null; addLog(T, 'מארח חדש לקח את השולחן'); });
    return;
  }
  if (!isHost()) return;
  if (c === 'close'){ confirmClose = true; render(); return; }
  if (c === 'closeno'){ confirmClose = false; render(); return; }
  if (c === 'closeyes'){
    confirmClose = false;
    const id = tid;
    (async () => {
      try { const q = await chatCol.get(); const b = db.batch(); q.docs.slice(0, 450).forEach(d => b.delete(d.ref)); await b.commit(); } catch(e){}
      try { await deckRef().delete(); } catch(e){}
      try { await db.doc('tables/' + id).delete(); } catch(e){ toast('השולחן לא נסגר, נסה שוב'); return; }
      goLobby();
    })();
    return;
  }
  if (c === 'reset'){ confirmReset = true; render(); return; }
  if (c === 'resetno'){ confirmReset = false; render(); return; }
  if (c === 'void'){ confirmVoid = true; render(); return; }
  if (c === 'voidno'){ confirmVoid = false; render(); return; }
  if (c === 'voidyes'){ confirmVoid = false; mutate(T => voidHand(T, Date.now()) ? undefined : false); return; }
  if (c === 'resetyes'){ confirmReset = false; const hid = S.hostId; mutate(T => { const n = newTable(hid); n.settings = T.settings; n.name = T.name; Object.keys(T).forEach(k => delete T[k]); Object.assign(T, n); }); return; }
  if (c === 'addbot'){
    const level = ($('#botLevel') && $('#botLevel').value) || 'normal';
    mutate(T => { const i = T.seats.findIndex(x => !x); if (i < 0) return false; addBot(T, i, level); });
    return;
  }
  if (c === 'resetstats'){ mutate(T => { T.stats = {}; addLog(T, 'הסטטיסטיקה אופסה'); }); return; }
  if (c === 'refill'){ mutate(T => { T.seats.forEach(s => { if (s) s.bank = T.settings.timeBank; }); addLog(T, 'בנק הזמן מולא לכולם'); }); return; }
  if (c === 'save'){
    const ns = readSettings();
    clearDrafts('s');
    const newName = $('#sName') ? $('#sName').value.trim().slice(0, 28) : null;
    mutate(T => { const o = T.settings;
      if (newName) T.name = newName;
      const mixChanged = ['mixOn','mixEvery','mixUnit','mixCount','base'].some(k => o[k] !== ns[k]);
      T.settings = Object.assign({}, o, ns);
      if (mixChanged) T.cycle = {phase:'base', left:null};
      addLog(T, 'המארח עדכן את הגדרות השולחן'); });
    toast('ההגדרות נשמרו'); return;
  }
  if (c === 'start'){ mutate(async T => { T.running = true; T.paused = false; T.nextReq = Date.now(); if (amDealer()) await dealerStart(T); }); return; }
  if (c === 'stop'){ mutate(T => { T.running = false; }); return; }
  if (c === 'pause'){ mutate(T => { T.paused = !T.paused; if (!T.paused && T.hand && T.hand.street !== 'done' && T.hand.deadline){ T.hand.deadline = deadlineFrom(T, Date.now()); } addLog(T, T.paused ? 'המשחק הושהה' : 'המשחק ממשיך'); }); return; }
  if (c === 'next'){
    if (readySeats(S).length < 2){ toast('צריך לפחות שני שחקנים עם צ׳יפים'); return; }
    mutate(async T => { if (T.hand && T.hand.street !== 'done') return false; T.nextReq = Date.now(); T.running = true; T.paused = false; if (amDealer()) return dealerStart(T); });
    return;
  }
}
async function sendChat(m){
  if (!chatCol) return;
  const me = mySeat(); const name = me >= 0 ? S.seats[me].name : (myDefaultName || 'צופה');
  try { await chatCol.add({id:myId, n:name, m:m.slice(0,200), t:Date.now()}); }
  catch(e){ toast('ההודעה לא נשלחה'); }
}

/* ---------- driver: dealer duties, timers and auto deal ---------- */
let botKey = null, botAt = 0;
function runAuto(fn){ busyAuto = true; const guard = setTimeout(() => busyAuto = false, 15000); Promise.resolve(mutate(fn)).finally(() => { clearTimeout(guard); busyAuto = false; }); }
setInterval(() => {
  document.querySelectorAll('.timer[data-deadline]').forEach(el => {
    const left = Math.max(0, +el.dataset.deadline - Date.now()); const t = timerMs(S) || 1;
    el.style.width = Math.min(100, 100*left/t) + '%';
    el.classList.toggle('low', left < 5000);
  });
  if (!S || busyAuto || (!LOCAL && (!canWrite || !myId))) return;
  const now = Date.now(), h = S.hand, dealer = amDealer();
  if (dealer && h){
    if (h.pending && kOk(K, h)){ const no = h.no; return runAuto(T => (T.hand && T.hand.no === no && resume(T, K, Date.now())) ? undefined : false); }
    if (h.street === 'done' && h.rabbitReq && !h.rabbit && kOk(K, h)){ const no = h.no; return runAuto(T => (T.hand && T.hand.no === no && rabbitHunt(T, K)) ? undefined : false); }
    if (h.shownBy && h.shownBy.some(i => h.P[i] && !h.P[i].cards) && kOk(K, h)){ const no = h.no; return runAuto(T => (T.hand && T.hand.no === no && revealShown(T, K)) ? undefined : false); }
  }
  if (dealer && h && h.street !== 'done' && !h.pending && !S.paused && kOk(K, h)){
    const bi = botToMove(S);
    if (bi != null){
      const key = `${tid}:${h.no}:${h.street}:${bi}:${h.currentBet}:${h.board.length}`;
      if (botKey !== key){ botKey = key; botAt = now + 350 + rnd(700); return; }
      if (now < botAt) return;
      const d = botDecide(S, K, bi); const no = h.no, street = h.street;
      botKey = null;
      return runAuto(T => (T.hand && T.hand.no === no && T.hand.street === street && botToMove(T) === bi && botAct(T, K, bi, d, Date.now())) ? undefined : false);
    }
  }
  const seated = mySeat() >= 0;
  if (!dealer && !seated && !isHost()) return;
  if (h && h.street !== 'done' && h.deadline && !S.paused && !h.pending && now > h.deadline + (dealer ? 300 : 8000)){
    const no = h.no;
    return runAuto(T => (T.hand && T.hand.no === no && timeoutTick(T, KK(), Date.now())) ? undefined : false);
  }
  if (dealer && !S.paused && (!h || h.street === 'done') && readySeats(S).length >= 2){
    const auto = S.running && st().autoNext && (!h || doneAge() > 5000);
    const asked = (S.nextReq || 0) > (S._lastStart || 0) && (S.nextReq || 0) > (h ? (h.endedAt || 0) : 0);
    if (auto || asked){
      const no = h ? h.no : 0;
      return runAuto(async T => {
        if (T.hand && (T.hand.street !== 'done' || T.hand.no !== no)) return false;
        const r = await dealerStart(T);
        if (r !== false) T._lastStart = Date.now();
        return r;
      });
    }
  }
}, 500);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (panel || menuOpen) && !editingEl()){ panel = null; menuOpen = false; render(); } });
// Only a real width change moves the seats. The phone keyboard changes only the height, so it must not redraw.
let lastW = window.innerWidth;
window.addEventListener('resize', () => {
  if (window.innerWidth === lastW) return;
  lastW = window.innerWidth;
  clearTimeout(window._rz); window._rz = setTimeout(render, 150);
});

/* ---------- lobby: anyone with the link can open a table and host it ---------- */
const isTableDoc = d => d && Array.isArray(d.seats) && d.settings;
let setupError = '';
function dbError(e){
  if (e && e.code === 'permission-denied') setupError = 'השרת חוסם את הגישה. צריך להדביק את כללי האבטחה ב-Firebase (Firestore ← Rules) וללחוץ Publish.';
  else if (e && e.code === 'failed-precondition') setupError = 'מסד הנתונים עוד לא נוצר. ב-Firebase: Firestore Database ← Create database.';
  else setupError = 'אין חיבור לשרת. בדוק את האינטרנט ונסה לרענן.';
  loaded = true; render();
}
function shareUrl(){ return location.origin + location.pathname + (tid ? '#t-' + tid : ''); }
async function shareLink(){
  const url = shareUrl();
  const text = tid && S ? `בואו לשחק פוקר: ${S.name || 'פוקר חברים'}` : 'בואו לשחק פוקר';
  if (navigator.share){ try { await navigator.share({title:'פוקר חברים', text, url}); return; } catch(e){ if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(url); toast('הקישור הועתק'); } catch(e){ toast(url); }
}
const waLink = () => 'https://wa.me/?text=' + encodeURIComponent(`בואו לשחק פוקר ${shareUrl()}`);
function goLobby(){
  if (unsubT){ unsubT(); unsubT = null; }
  if (unsubC){ unsubC(); unsubC = null; }
  tid = null; S = null; K = null; kFor = null; panel = null; menuOpen = false; CHAT = {msgs:[]}; seenChat = 0;
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  try { localStorage.removeItem('pk_table'); } catch(e){}
  if (!unsubLobby){
    unsubLobby = db.collection('tables').onSnapshot(q => {
      LOBBY = q.docs.map(d => ({id:d.id, t:d.data()})).filter(x => isTableDoc(x.t));
      loaded = true; setupError = '';
      if (!tid) render();
    }, dbError);
  }
  render();
}
function openTable(id){
  if (unsubLobby){ unsubLobby(); unsubLobby = null; }
  if (unsubT) unsubT(); if (unsubC) unsubC();
  tid = id; S = null; K = null; kFor = null; CHAT = {msgs:[]}; seenChat = 0; panel = null; skeleton = false;
  try { history.replaceState(null, '', '#t-' + id); } catch(e){}
  try { localStorage.setItem('pk_table', id); } catch(e){}
  ref = db.doc('tables/' + id);
  chatCol = db.collection('chats/' + id + '/msgs');
  loaded = false;
  unsubT = ref.onSnapshot(snap => {
    if (tid !== id) return;
    loaded = true;
    const d = snap.exists ? snap.data() : null;
    if (!isTableDoc(d)){ S = null; toast('השולחן לא קיים יותר'); goLobby(); return; }
    S = clone(d);
    if (!S.requests) S.requests = []; if (!S.log) S.log = []; if (!S.ledger) S.ledger = {}; if (!S.stats) S.stats = {};
    S.settings = Object.assign({timeBank:60, rabbit:true}, S.settings);
    if (S.hostId === myId && kFor !== id){
      kFor = id;
      deckRef().get().then(dk => { if (tid === id && dk.exists && !K){ K = clone(dk.data()); render(); } }).catch(() => {});
    }
    const me = mySeat();
    if (me >= 0 && myPub && S.seats[me].pk !== myPub && !busyAuto){
      busyAuto = true;
      Promise.resolve(mutate(T => { const j = T.seats.findIndex(x => x && x.id === myId); if (j < 0 || T.seats[j].pk === myPub) return false; T.seats[j].pk = myPub; })).finally(() => busyAuto = false);
    }
    render();
  }, dbError);
  unsubC = chatCol.orderBy('t').limitToLast(80).onSnapshot(q => {
    if (tid !== id) return;
    const prevLen = CHAT.msgs.length;
    CHAT = {msgs: q.docs.map(d => d.data())};
    const last = CHAT.msgs[CHAT.msgs.length-1];
    if (panel !== 'chat' && CHAT.msgs.length > prevLen && prevLen > 0 && last && last.id !== myId) toast(`${last.n}: ${last.m}`);
    if (prevLen === 0 && seenChat === 0) seenChat = CHAT.msgs.length;
    if (S) render();
  }, () => {});
  render();
}
function lobbyHtml(){
  if (setupError) return `<div class="lobby"><h1>פוקר חברים</h1><p class="hint">${esc(setupError)}</p><button class="btn" onclick="location.reload()">רענן</button></div>`;
  const list = LOBBY.slice().sort((a,b) => (b.t.handNo||0) - (a.t.handNo||0));
  const cards = list.map(({id, t}) => {
    const host = (t.seats.find(x => x && x.id === t.hostId) || {}).name;
    const n = t.seats.filter(Boolean).length;
    const s = t.settings;
    const live = t.running && !t.paused;
    return `<button class="tcard" data-open="${esc(id)}">
      <span class="tname">${esc(t.name || 'שולחן')}</span>
      <span class="tmeta">${GAME_NAME[s.base] || ''}${s.mixOn && s.base !== 'omaha' ? ' + אומהה' : ''} · <span class="num">${s.sb}/${s.bb}</span> · <span class="num">${n}/9</span> שחקנים</span>
      <span class="tmeta">${host ? 'מארח: ' + esc(host) : ''}${t.hostId === myId ? ' (אתה)' : ''} ${live ? '<span class="dotlive">משחקים עכשיו</span>' : ''}</span>
    </button>`;
  }).join('');
  return `<div class="lobby">
    <h1>פוקר חברים</h1>
    <form class="newt" id="nameForm" style="border-top:0;padding-top:0"><label class="field">השם שלך<input type="text" id="myName" maxlength="18" value="${esc(myDefaultName)}" placeholder="איך יקראו לך בשולחן" required></label><button class="btn small">שמור</button></form>
    <p class="hint">בחרו שולחן או פתחו שולחן משלכם. מי שפותח שולחן הוא המארח והדילר שלו.</p>
    <div class="tlist">${cards || '<div class="hint">אין עדיין שולחנות פתוחים.</div>'}</div>
    <div class="row"><button class="btn primary" data-setup="table">פתח שולחן חדש</button><button class="btn" data-setup="practice">תרגול מול בוטים</button></div>
    <div class="row"><a class="btn small" href="${waLink()}" target="_blank" rel="noopener">שלח בווצאפ</a><button class="btn small ghost" data-share>שתף קישור</button></div>
    <p class="note">כמארח, השאר את הדף פתוח בזמן המשחק: אתה מחלק את הקלפים. לחצו "הוספה למסך הבית" בתפריט הדפדפן כדי לקבל אייקון כמו אפליקציה.</p>
  </div>`;
}
function bindLobby(){
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { if (!myDefaultName){ toast('קודם כתוב את השם שלך'); $('#myName').focus(); return; } openTable(b.dataset.open); });
  document.querySelectorAll('[data-share]').forEach(b => b.onclick = shareLink);
  const nf = $('#nameForm');
  if (nf) nf.onsubmit = e => { e.preventDefault(); const v = $('#myName').value.trim().slice(0,18); if (!v) return; myDefaultName = v; try { localStorage.setItem('pk_name', v); } catch(_){} toast('נשמר'); };
  const mn = $('#myName'); if (mn) mn.onchange = () => { const v = mn.value.trim().slice(0,18); if (v){ myDefaultName = v; try { localStorage.setItem('pk_name', v); } catch(_){} } };
  document.querySelectorAll('[data-setup]').forEach(b => b.onclick = () => {
    const v = $('#myName').value.trim().slice(0,18);
    if (!v){ toast('קודם כתוב את השם שלך'); $('#myName').focus(); return; }
    myDefaultName = v; try { localStorage.setItem('pk_name', v); } catch(_){}
    openSetup(b.dataset.setup === 'practice');
  });
}
// New table: choose every setting before anyone sits down. Nothing is dealt until the host presses Start.
function openSetup(practice){
  const d = newTable(myId).settings;
  $('#sheet').innerHTML = `<div class="sheet setup" id="setupSheet"><form class="box wide" id="setupForm">
    <h2 style="margin:0;font-family:var(--f-display);font-weight:400">${practice ? 'תרגול מול בוטים' : 'שולחן חדש'}</h2>
    <label class="field">שם השולחן<input type="text" id="nName" maxlength="28" required value="${esc(practice ? 'תרגול של ' + myDefaultName : '')}" placeholder="למשל: השולחן של חמישי"></label>
    <h3>שחקנים</h3>
    <label class="chk"><input type="checkbox" id="nSeatMe" ${practice ? 'checked' : ''}> להושיב אותי בשולחן עכשיו</label>
    <div class="grid2">
      <label class="field">בוטים<select id="nBots">${[0,1,2,3,4,5,6,7,8].map(k => `<option value="${k}" ${k === (practice ? 3 : 0) ? 'selected' : ''}>${k === 0 ? 'בלי בוטים' : k}</option>`).join('')}</select></label>
      <label class="field">רמת הבוטים<select id="nBotLevel">${Object.entries(BOT_LEVELS).map(([k,v]) => `<option value="${k}" ${k === 'normal' ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    </div>
    ${settingsFields(d, 'n')}
    <div class="row sticky-actions"><button class="btn primary">צור שולחן</button><button type="button" class="btn ghost" id="setupCancel">ביטול</button></div>
    <div class="note">המשחק לא מתחיל מעצמו. כשכולם יושבים, לוחצים "התחל משחק".</div>
  </form></div>`;
  $('#setupCancel').onclick = () => $('#sheet').innerHTML = '';
  $('#setupForm').onsubmit = async e => {
    e.preventDefault();
    const name = $('#nName').value.trim().slice(0, 28); if (!name) return;
    const T = newTable(myId); T.name = name;
    T.settings = Object.assign({}, T.settings, readSettings('n', T.settings));
    if ($('#nSeatMe').checked) seatPlayer(T, 0, myId, myDefaultName, T.settings.startStack, myPub);
    const bots = +$('#nBots').value, level = $('#nBotLevel').value;
    const order = [4, 2, 6, 3, 5, 7, 1, 8, 0];
    for (let k = 0, added = 0; k < order.length && added < bots; k++){ if (!T.seats[order[k]]){ addBot(T, order[k], level); added++; } }
    const id = Array.from({length:8}, () => 'abcdefghijkmnpqrstuvwxyz23456789'[rnd(32)]).join('');
    try { await db.doc('tables/' + id).set(clone(T)); $('#sheet').innerHTML = ''; openTable(id); }
    catch(err){ toast(err && err.code === 'permission-denied' ? 'השרת חוסם. בדוק את כללי האבטחה ב-Firebase.' : 'השולחן לא נפתח, נסה שוב'); }
  };
}

/* ---------- boot ---------- */
function fatal(msg){ loaded = true; $('#app').innerHTML = `<div class="lobby"><h1>פוקר חברים</h1><p class="hint">${esc(msg)}</p><div class="row"><button class="btn" onclick="location.reload()">נסה שוב</button><button class="btn ghost" id="goLocal">שחק ממכשיר אחד</button></div></div>`; $('#goLocal').onclick = () => { LOCAL = true; S = null; render(); }; }
(async function boot(){
  try { myDefaultName = localStorage.getItem('pk_name') || ''; } catch(e){}
  if (!window.firebase || !window.crypto || !crypto.subtle){ fatal('לא הצלחנו להתחבר לשרת. בדוק את האינטרנט ונסה שוב.'); return; }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    const auth = firebase.auth();
    const u = await new Promise((res, rej) => {
      const un = auth.onAuthStateChanged(x => { if (x){ un(); res(x); } });
      if (!auth.currentUser) auth.signInAnonymously().catch(rej);
    });
    myId = u.uid;
  } catch(e){
    fatal(e && e.code === 'auth/operation-not-allowed' || e && e.code === 'auth/admin-restricted-operation'
      ? 'צריך להפעיל כניסה אנונימית ב-Firebase: Authentication ← Sign-in method ← Anonymous ← Enable.'
      : 'לא הצלחנו להתחבר לשרת. בדוק את האינטרנט ונסה שוב.');
    return;
  }
  canWrite = true;
  try { await ensureKeys(); } catch(e){}
  let start = null;
  const hm = /^#t-([a-z0-9]{3,40})$/.exec(location.hash || '');
  if (hm) start = hm[1];
  else { try { start = localStorage.getItem('pk_table'); } catch(e){} }
  if (start && myDefaultName){
    try { const d = await db.doc('tables/' + start).get(); if (d.exists && isTableDoc(d.data())){ openTable(start); return; } } catch(e){ dbError(e); }
  }
  goLobby();
  setTimeout(() => { if (!loaded){ loaded = true; render(); } }, 8000);
})();
</script>
</body>
